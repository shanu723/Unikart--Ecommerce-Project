{% extends 'admin_templates/admin_dashboard.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Add New Product</h2>
    <form method="POST" enctype="multipart/form-data" id="productForm">
        {% csrf_token %}

        <!-- Product Info -->
        <div class="card mb-4">
            <div class="card-header">Product Details</div>
            <div class="card-body">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" name="brand" class="form-control">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" class="form-control" required>
                        <option value="">-- Select --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="4"></textarea>
                </div>

                <div class="form-check">
                    <input type="checkbox" name="status" class="form-check-input" id="statusCheck">
                    <label for="statusCheck" class="form-check-label">Active</label>
                </div>
            </div>
        </div>

        <!-- Product Images -->
        <div class="form-group">
    <label>Upload Images</label>
    <input type="file" name="product_images" id="imageInput" class="form-control" multiple required>
</div>
<div id="imagePreview" class="mt-3 d-flex flex-wrap gap-2"></div>


        <!-- Variations -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between">
                Variations
                <button type="button" class="btn btn-sm btn-primary" onclick="addVariation()">+ Add</button>
            </div>
            <div class="card-body" id="variation-container">
                <!-- JS will append fields here -->
            </div>
        </div>

       <!-- Highlights / Specifications -->
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between">
        Highlights / Specifications
        <button type="button" class="btn btn-sm btn-primary" onclick="addHighlight()">+ Add</button>
    </div>
    <div class="card-body" id="highlight-container">
        <!-- Example of a pre-filled highlight (can be looped in edit form) -->
        <div class="highlight-item mb-2 d-flex gap-2">
            <select name="highlight_keys[]" class="form-control">
                <option value="">Select Key</option>
                <option value="Supported Apps">Supported Apps</option>
                <option value="RAM">RAM</option>
                <option value="Power Supply">Power Supply</option>
                <option value="Display Technology">Display Technology</option>
                <option value="Processor">Processor</option>
                <option value="Resolution">Resolution</option>
                <option value="Sound Output">Sound Output</option>
                <option value="Operating System">Operating System</option>
                <option value="Price">Price</option>
            </select>
            <input type="text" name="highlight_values[]" class="form-control" placeholder="Value">
        </div>
    </div>
</div>


      

        <button type="submit" class="btn btn-success">Save Product</button>
    </form>
</div>

<script>
    function addVariation() {
        const container = document.getElementById('variation-container');
        container.insertAdjacentHTML('beforeend', `
            <div class="row mb-3">
                <div class="col-md-2">
                    <label>Size</label>
                    <select name="size[]" class="form-control">
                        <option value="32">32 inch</option>
                        <option value="43">43 inch</option>
                        <option value="50">50 inch</option>
                        <option value="60">60 inch</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label>Original Price</label>
                    <input type="number" step="0.01" name="original_price[]" class="form-control" required>
                </div>
                
                <div class="col-md-2">
                    <label>Stock</label>
                    <input type="number" name="stock[]" class="form-control" required>
                </div>
                <div class="col-md-2 d-flex align-items-center">
                    <div class="form-check mt-3">
                        <input type="checkbox" name="variation_status[]" class="form-check-input">
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
            </div>
        `);
    }

    function addHighlight() {
    document.getElementById('highlight-container').insertAdjacentHTML('beforeend', `
        <div class="highlight-item mb-2 d-flex gap-2">
            <select name="highlight_keys[]" class="form-control">
                <option value="">Select Key</option>
                <option value="Supported Apps">Supported Apps</option>
                <option value="RAM">RAM</option>
                <option value="Power Supply">Storage</option>
                <option value="Display Technology">Display Technology</option>
                <option value="Processor">Processor</option>
                <option value="Resolution">Resolution</option>
                <option value="Sound Output">Sound Output</option>
                <option value="Operating System">Operating System</option>
                <option value="Price">Price</option>
            </select>
            <input type="text" name="highlight_values[]" class="form-control" placeholder="Value">
        </div>
    `);
}


   
    document.getElementById('imageInput').addEventListener('change', function(event) {
    const previewContainer = document.getElementById('imagePreview');
    previewContainer.innerHTML = '';  // Clear previous previews

    const files = event.target.files;
    if (files.length === 0) return;

    Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'rounded border';
            img.style.width = '100px';
            img.style.height = '100px';
            img.style.objectFit = 'cover';
            img.style.marginRight = '10px';
            previewContainer.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
});
</script>
{% endblock %}
