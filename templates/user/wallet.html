{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">My Wallet</h2>

    <div class="card shadow-sm p-4">
        <h4>Current Balance: ₹{{ wallet.balance }}</h4>

        <form id="addMoneyForm" method="POST">
            {% csrf_token %}
            <div class="form-group mt-3">
                <label for="amount">Enter Amount to Add:</label>
                <input type="number" class="form-control" id="amount" name="amount" placeholder="Enter amount" required>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Add Money</button>
        </form>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.getElementById('addMoneyForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const amount = document.getElementById('amount').value;
    if (!amount || amount <= 0) {
        alert("Please enter a valid amount");
        return;
    }

    // Send AJAX request to create Razorpay order
    fetch("{% url 'add_money_to_wallet' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "amount=" + amount
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }

        // Initialize Razorpay
        const options = {
            key: data.razorpay_key_id,
            amount: data.amount,
            currency: "INR",
            name: "Add Money to Wallet",
            description: "Wallet top-up",
            order_id: data.razorpay_order_id,
            handler: function (response) {
                // After successful payment
                const formData = new FormData();
                formData.append('razorpay_payment_id', response.razorpay_payment_id);
                formData.append('razorpay_order_id', response.razorpay_order_id);
                formData.append('amount', amount);

                fetch("{% url 'wallet_payment_success' %}", {
                    method: "POST",
                    body: formData
                }).then(() => {
                    alert("Payment successful! Wallet updated.");
                    window.location.href = "{% url 'wallet' %}";
                });
            },
            theme: {
                color: "#3399cc"
            }
        };
        const rzp = new Razorpay(options);
        rzp.open();
    })
    .catch(error => console.error("Error:", error));
});
</script>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
{% endblock %}
