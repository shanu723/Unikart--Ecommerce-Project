{% extends 'admin_templates/admin_dashboard.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Add New Product</h2>
    <form method="POST" enctype="multipart/form-data" id="productForm">
        {% csrf_token %}

        <!-- Product Info -->
        <div class="card mb-4">
            <div class="card-header">Product Details</div>
            <div class="card-body">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" name="brand" class="form-control">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" class="form-control" required>
                        <option value="">-- Select --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="4"></textarea>
                </div>

                <div class="form-check">
                    <input type="checkbox" name="status" class="form-check-input" id="statusCheck" checked>
                    <label for="statusCheck" class="form-check-label">Active</label>
                </div>
            </div>
        </div>

        <!-- Product Images -->
        <div class="card mb-4">
            <div class="card-header">Product Images</div>
            <div class="card-body">
                <div class="form-group">
                    <label>Upload Images</label>
                    <input type="file" name="product_images[]" id="imageInput" class="form-control" multiple>

                    <small class="text-muted">You can select multiple images. Click the X on preview to remove.</small>
                </div>
                <div id="imagePreview" class="mt-3 d-flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- Variations -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between">
                Variations
                <button type="button" class="btn btn-sm btn-primary" onclick="addVariation()">+ Add</button>
            </div>
            <div class="card-body" id="variation-container">
                <!-- Initial Variation Row -->
                <div class="row mb-3">
                    <div class="col-md-2">
                        <label>Size</label>
                        <select name="size[]" class="form-control">
                            <option value="32">32 inch</option>
                            <option value="43">43 inch</option>
                            <option value="50">50 inch</option>
                            <option value="55">55 inch</option>
                            <option value="60">60 inch</option>
                            <option value="65">65 inch</option>
                            <option value="75">75 inch</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label>Original Price</label>
                        <input type="number" step="0.01" name="original_price[]" class="form-control" required>
                    </div>
                    
                    <div class="col-md-2">
                        <label>Stock</label>
                        <input type="number" name="stock[]" class="form-control" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-center">
                        <div class="form-check mt-3">
                            <input type="checkbox" name="variation_status[]" class="form-check-input" checked>
                            <label class="form-check-label">Active</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

       <!-- Highlights / Specifications -->
        <div class="card mb-4">
            <div class="card-header">
                Highlights / Specifications
            </div>
            <div class="card-body" id="highlight-container">
                <!-- Static Fields as requested -->
                <!-- Field 1 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Supported Apps" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Supported Apps">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. Netflix, YouTube">
                    </div>
                </div>

                <!-- Field 2 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="RAM" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="RAM">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. 2GB">
                    </div>
                </div>

                <!-- Field 3 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Storage" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Storage">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. 16GB">
                    </div>
                </div>

                <!-- Field 4 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Display Technology" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Display Technology">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. LED">
                    </div>
                </div>

                <!-- Field 5 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Processor" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Processor">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. Quad Core">
                    </div>
                </div>

                <!-- Field 6 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Resolution" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Resolution">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. 3840 x 2160">
                    </div>
                </div>

                <!-- Field 7 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Sound Output" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Sound Output">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. 20W">
                    </div>
                </div>

                <!-- Field 8 -->
                <div class="highlight-item mb-3 row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" value="Operating System" readonly style="background-color: #f8f9fa;">
                        <input type="hidden" name="highlight_keys[]" value="Operating System">
                    </div>
                    <div class="col-md-8">
                        <input type="text" name="highlight_values[]" class="form-control" placeholder="e.g. Android TV">
                    </div>
                </div>
                
            </div>
        </div>

        <button type="submit" class="btn btn-success">Save Product</button>
    </form>
</div>

<script>
    function addVariation() {
        const container = document.getElementById('variation-container');
        container.insertAdjacentHTML('beforeend', `
            <div class="row mb-3">
                <div class="col-md-2">
                    <label>Size</label>
                    <select name="size[]" class="form-control">
                        <option value="32">32 inch</option>
                        <option value="43">43 inch</option>
                        <option value="50">50 inch</option>
                        <option value="55">55 inch</option>
                        <option value="60">60 inch</option>
                        <option value="65">65 inch</option>
                        <option value="75">75 inch</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label>Original Price</label>
                    <input type="number" step="0.01" name="original_price[]" class="form-control" required>
                </div>
                
                <div class="col-md-2">
                    <label>Stock</label>
                    <input type="number" name="stock[]" class="form-control" required>
                </div>
                <div class="col-md-2 d-flex align-items-center">
                    <div class="form-check mt-3">
                        <input type="checkbox" name="variation_status[]" class="form-check-input" checked>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex align-items-center">
                     <button type="button" class="btn btn-danger btn-sm mt-3" onclick="this.closest('.row').remove()">Remove</button>
                </div>
            </div>
        `);
    }

    // --- Better Image Upload Logic ---
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    // We use a DataTransfer object to hold the files because we can't directly manipulate FileList
    const dt = new DataTransfer();

    imageInput.addEventListener('change', function(e) {
        for(let i = 0; i < this.files.length; i++){
            let file = this.files[i];
            // Add file to DataTransfer
            dt.items.add(file);
        }
        // Update the input files to match our DataTransfer list (accumulating files)
        this.files = dt.files;
        
        // Re-render previews
        updateImagePreviews();
    });

    function updateImagePreviews() {
        imagePreview.innerHTML = '';
        
        Array.from(dt.files).forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const div = document.createElement('div');
                div.className = 'position-relative d-inline-block';
                
                // Image
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'rounded border';
                img.style.width = '100px';
                img.style.height = '100px';
                img.style.objectFit = 'cover';
                
                // Close Button
                const btn = document.createElement('button');
                btn.innerHTML = '×';
                btn.className = 'btn btn-danger btn-sm position-absolute';
                btn.style.top = '-5px';
                btn.style.right = '-5px';
                btn.style.borderRadius = '50%';
                btn.style.padding = '0px 6px';
                btn.style.lineHeight = '18px';
                
                btn.onclick = function() {
                    // Remove item from DataTransfer at this index
                    dt.items.remove(index);
                    // Update input files
                    imageInput.files = dt.files;
                    // Re-render
                    updateImagePreviews();
                };

                div.appendChild(img);
                div.appendChild(btn);
                imagePreview.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    }
</script>
{% endblock %}
