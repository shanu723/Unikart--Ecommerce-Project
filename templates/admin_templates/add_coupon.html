{% extends 'admin_templates/admin_dashboard.html' %}
{% load static %}
{% block content %}
<div class="container mt-4">
   {% if messages %}
    <div class="mt-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  <h2>Add Coupon</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label>Coupon Code</label>
      <input type="text" name="code" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Discount Amount</label>
      <input type="number" step="0.01" name="discount_amount" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Valid From</label>
      <input type="datetime-local" name="valid_from" class="form-control">
    </div>
    <div class="mb-3">
      <label>Valid To</label>
      <input type="datetime-local" name="valid_to" class="form-control">
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" name="active" class="form-check-input" id="activeCheck">
      <label class="form-check-label" for="activeCheck">Active</label>
    </div>
    <button type="submit" class="btn btn-success">Add Coupon</button>
  </form>
</div>
{% endblock %}
