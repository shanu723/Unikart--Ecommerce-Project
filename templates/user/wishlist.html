{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="wishlist-section">
  <div class="container">
    <h2 class="text-center mb-4">My Wishlist</h2>
    {% if wishlist_items %}
      <div class="row">
        {% for item in wishlist_items %}
          <div class="col-md-4 mb-4">
            <div class="card">
              <img src="{{ item.product.image.url }}" class="card-img-top" alt="{{ item.product.name }}">
              <div class="card-body text-center">
                <h5 class="card-title">{{ item.product.name }}</h5>
                <p class="card-text">₹{{ item.product.price }}</p>
                <a href="{% url 'product_detail' item.product.id %}" class="btn btn-outline-primary">View Product</a>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="text-center">
        <img src="{% static 'images/empty_wishlist.png' %}" alt="Empty Wishlist" class="img-fluid" style="max-width:300px;">
        <h4 class="mt-3">Your wishlist is empty</h4>
        <a href="{% url 'shop' %}" class="btn btn-primary mt-3">Continue Shopping</a>
      </div>
    {% endif %}
  </div>
</section>
{% endblock %}
